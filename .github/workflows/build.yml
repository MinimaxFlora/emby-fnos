name: Build fnOS packages

# 在 Linux runner 上构建两个架构的原生 fpk。
#
# 为什么 CI 用 Linux 而不是 Windows：
#   本机（Windows）构建必须绕一大圈 —— Windows 建不了符号链接、WSL 建的链接
#   Windows 工具又读不了，所以负载里的 soname 别名被解引用成实体文件，
#   再由安装脚本在 NAS 上重建。Linux runner 上这一切都不存在，
#   而且本项目已收敛到「负载只放实体文件 + 库目录按实测拆分」的方案
#   （见 build/split_libs.py），所以 CI 与本机产出一致，也不需要 WSL 这一层。
#
# 版本如何决定：
#   不写死版本号，而是**查询上游**并交叉验证两个来源 ——
#     1. Emby 官方 stable release（GitHub /releases/latest，自动排除 beta）
#     2. amilys/embyserver 在 Docker Hub 上是否有对应版本的镜像 tag
#   两者都有该版本才使用；否则回退到上一个能对上的版本。
#   这样上游一更新，定时任务就会自动构建并发布新版本。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # 每天 03:17 (UTC) 自动检查上游是否有新版本
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      emby_version:
        description: 手动指定 Emby 版本（留空 = 自动查询上游）
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. 决定要构建的版本
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
      is_release: ${{ steps.pick.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4

      - name: 查询上游版本
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.emby_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request

          UA = {"User-Agent": "emby-fnos-builder"}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def stable_versions():
              """Emby 官方 stable release 的版本列表（API 已排除预发布）。"""
              out = []
              rel = get("https://api.github.com/repos/MediaBrowser/Emby.Releases/releases?per_page=30")
              for r in rel:
                  tag = (r.get("tag_name") or "").strip()
                  name = (r.get("name") or "")
                  # 明确跳过 beta / 预发布
                  if r.get("prerelease") or "beta" in name.lower():
                      continue
                  if re.fullmatch(r"\d+(\.\d+)+", tag):
                      out.append(tag)
              return out

          def image_tags():
              """amilys/embyserver 上的镜像 tag（我们取运行时的那一半）。"""
              tags = set()
              url = ("https://hub.docker.com/v2/repositories/amilys/embyserver/tags"
                     "?page_size=100&ordering=last_updated")
              for t in get(url).get("results", []):
                  tags.add(t.get("name", ""))
              return tags

          manual = (os.environ.get("INPUT_VERSION") or "").strip()
          if manual:
              version = manual
              print(f"::notice::使用手动指定版本 {version}")
          else:
              versions = stable_versions()
              tags = image_tags()
              print(f"官方 stable 版本（新→旧）: {versions[:6]}")
              version = ""
              for v in versions:
                  # 必须两个来源都有：deb 来自官方，system/ 来自 amilys 镜像
                  if f"{v}-amd64" in tags and f"{v}-arm64" in tags:
                      version = v
                      print(f"选定 {v}（官方 stable 且镜像双架构齐备）")
                      break
              if not version:
                  raise SystemExit("找不到两边都齐备的稳定版本")

          # 只有 push / 定时 / 手动才发版；PR 只构建不发版
          is_release = os.environ.get("GITHUB_EVENT_NAME") != "pull_request"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={version}\n")
              f.write(f"is_release={'true' if is_release else 'false'}\n")
          print(f"version={version} is_release={is_release}")
          PY
        shell: bash

  # ---------------------------------------------------------------------------
  # 2. 构建两个架构
  # ---------------------------------------------------------------------------
  build:
    needs: detect
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            emby_arch: amd64
            platform: x86
          - arch: arm
            emby_arch: arm64
            platform: arm

    name: ${{ matrix.arch }} (${{ matrix.emby_arch }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖（Pillow 仅用于图标校验）
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: 下载 fnpack（官方 Linux 构建）
        run: |
          set -euo pipefail
          mkdir -p _tools
          curl -fsSL -o _tools/fnpack \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x _tools/fnpack
          file _tools/fnpack
          # fnpack 没有 --version 子命令，只打印 help 确认可执行
          ./_tools/fnpack --help 2>&1 | head -5 || true

      # -----------------------------------------------------------------------
      # 授权预置数据：值来自仓库 Secret / Variable，仓库里没有明文。
      # Secret 的格式与随包的 config/license.json 一致（含 filename/state/hosts），
      # 这里原样落到文件即可；Variable 里的 hosts 若设了就覆盖。
      # 未配置时生成空配置，后续步骤会跳过注入，构建照常成功。
      # -----------------------------------------------------------------------
      - name: 注入授权预置数据（来自 Secrets / Variables）
        env:
          LICENSE_JSON: ${{ secrets.EMBY_LICENSE_JSON }}
          LICENSE_HOSTS: ${{ vars.EMBY_LICENSE_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p emby/config
          # 用 python 解析，避免 shell 引号把 JSON 弄坏
          python3 - <<'PY'
          import json, os

          raw = (os.environ.get("LICENSE_JSON") or "").strip()
          hosts_var = (os.environ.get("LICENSE_HOSTS") or "").strip()

          if not raw:
              print("::warning::未配置 EMBY_LICENSE_JSON，将构建不带授权预置数据的包")
              raise SystemExit(0)

          # Secret 里存的就是 config/license.json 的内容；但为了容错，
          # 如果它不是合法 JSON 对象（例如只贴了一段 state 文本），就当成 state。
          try:
              cfg = json.loads(raw)
              if not isinstance(cfg, dict):
                  raise ValueError
          except Exception:
              cfg = {"state": raw}

          # 必填字段体检：state 缺失或为空时报警，避免静默产出无授权的包
          if not (cfg.get("state") or "").strip():
              print("::warning::EMBY_LICENSE_JSON 里没有可用的 state 字段")
          if not (cfg.get("filename") or "").strip():
              print("::warning::EMBY_LICENSE_JSON 里没有 filename，将不会写入状态文件")
          if hosts_var:
              cfg["hosts"] = hosts_var

          with open("emby/config/license.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, ensure_ascii=False)

          print(f"已生成 emby/config/license.json："
                f"filename {'有' if cfg.get('filename') else '无'}、"
                f"state {len(cfg.get('state') or '')} 字符、"
                f"hosts {'有' if cfg.get('hosts') else '无'}")
          PY

      - name: 校验授权预置数据结构
        run: |
          set -euo pipefail
          if [ ! -f emby/config/license.json ]; then
            echo "未配置授权预置数据，跳过校验"
            exit 0
          fi
          # 坏掉的配置必须在这里就失败，不能等到装到 NAS 上才发现
          python3 - <<'PY'
          import json, sys

          d = json.load(open("emby/config/license.json", encoding="utf-8"))
          if not isinstance(d, dict):
              sys.exit("license.json 顶层不是对象")
          print(f"顶层 keys: {list(d.keys())}")

          fn = (d.get("filename") or "").strip()
          st = (d.get("state") or "").strip()

          problems = []
          if not fn:
              problems.append("缺少 filename")
          if not st:
              problems.append("缺少 state")
          else:
              # state 本身必须是一段合法 JSON —— 这能抓住「Secret 被转义破坏」
              # 这类问题（实测踩过：引号被 shell/PowerShell 吃掉后整段变成非法 JSON）
              try:
                  inner = json.loads(st)
                  if not isinstance(inner, dict):
                      problems.append("state 不是 JSON 对象")
                  else:
                      print(f"state 内层 keys: {list(inner.keys())}")
              except Exception as exc:
                  problems.append(f"state 不是合法 JSON：{exc}")
          if "/" in fn or fn in (".", ".."):
              problems.append(f"filename 含路径分隔符：{fn}")

          if problems:
              for p in problems:
                  print(f"::error::授权预置数据有问题：{p}")
              sys.exit(1)
          print("授权预置数据结构正确")
          PY

      - name: 准备官方 deb
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p _work
          URL="https://github.com/MediaBrowser/Emby.Releases/releases/download/${VERSION}/emby-server-deb_${VERSION}_${{ matrix.emby_arch }}.deb"
          echo "下载 $URL"
          curl -fsSL --retry 3 -o "_work/emby-${{ matrix.emby_arch }}.deb" "$URL"
          python build/extract_deb.py \
            --deb "_work/emby-${{ matrix.emby_arch }}.deb" \
            --out "_work/deb-${{ matrix.emby_arch }}"

      - name: 组装负载（含库目录拆分）
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          bash build/build_payload.sh ${{ matrix.arch }} --version "${VERSION}"

      - name: 渲染 manifest
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          # manifest 每次从模板渲染：就地改写会把占位符吃掉，第二次构建就失败
          sed -e "s/@PLATFORM@/${{ matrix.platform }}/" \
              -e "s/@APPVERSION@/${VERSION}/" \
              emby/manifest.template > emby/manifest
          if grep -q '@[A-Z]*@' emby/manifest; then
            echo "manifest 仍有未替换占位符"; exit 1
          fi
          cat emby/manifest

      - name: 自检（负载里不能有随包 libc/loader）
        run: |
          set -euo pipefail
          fail=0
          for f in libc.so.6 ld-linux-x86-64.so.2 ld-linux-aarch64.so.1 \
                   libstdc++.so.6 libm.so.6 libgcc_s.so.1; do
            if [ -e "emby/app/lib/$f" ] || [ -e "emby/app/system/$f" ]; then
              echo "FAIL 随包 $f 未剔除：会覆盖系统库并导致段错误"
              fail=1
            fi
          done
          for f in system/EmbyServer system/libcoreclr.so system/libsqlite3.so \
                   system/libSkiaSharp.so system/libvips.so.42 \
                   bin/emby-server bin/ffmpeg lib/libavcodec.so.59.37.100 ui/config; do
            [ -e "emby/app/$f" ] || { echo "FAIL 缺少 $f"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "负载自检通过，共 $(find emby/app -type f | wc -l) 个文件"

      - name: 校验官方图标（必须透明背景）
        run: python build/fetch_official_icons.py --check

      - name: 打包
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist _work/fpk-out
          # fnpack 把 fpk 写到当前工作目录，所以先切进去
          cd _work/fpk-out
          "$GITHUB_WORKSPACE/_tools/fnpack" build --directory "$GITHUB_WORKSPACE/emby"
          ls -la
          FPK=$(ls *.fpk | head -1)
          OUT="$GITHUB_WORKSPACE/dist/emby_${VERSION}_${{ matrix.arch }}_native.fpk"
          mv "$FPK" "$OUT"
          ls -lh "$OUT"

      - name: 确认包里没有明文授权数据泄漏到顶层
        run: |
          set -euo pipefail
          # 授权数据只应在 app/config/license.json（安装时才被读取），
          # 不应出现在 cmd/ 或 manifest 里
          if grep -rl 'isTrial' emby/cmd emby/manifest 2>/dev/null; then
            echo "FAIL 授权数据出现在脚本里，应只放在 config/license.json"
            exit 1
          fi
          if [ -f emby/config/license.json ]; then
            echo "授权预置数据已随包（emby/config/license.json）"
          else
            echo "本包不含授权预置数据"
          fi

      - name: 回归测试
        run: bash build/test-native.sh

      - uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.arch }}
          path: dist/*.fpk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. 发布
  #
  #  不需要手动打 tag：push / 定时 / 手动触发都会走到这里，
  #  用「上游版本号」作为 tag；同名 tag 已存在就先删掉再重建，
  #  这样上游一更新就自动产出对应版本。
  # ---------------------------------------------------------------------------
  release:
    needs: [detect, build]
    if: needs.detect.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -name '*.fpk' -exec cp -v {} release/ \;
          ls -lh release/
          count=$(find release -name '*.fpk' | wc -l)
          [ "$count" -eq 2 ] || { echo "预期 2 个 fpk，实际 $count"; exit 1; }

      - name: 发布（幂等：同名 tag/release 先删除再重建）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${VERSION}"

          # 已存在同名 release 就删掉（连带 tag），保证可重复发布
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "已存在 release ${TAG}，先删除"
            gh release delete "${TAG}" --yes --cleanup-tag
          fi
          # tag 可能残留（例如 release 被单独删过）
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true

          gh release create "${TAG}" \
            --title "Emby ${VERSION} for 飞牛 fnOS" \
            --notes "$(cat <<EOF
          基于 amilys/embyserver ${VERSION} 运行时构建的原生安装包（非 Docker）。

          | 包 | 架构 |
          |---|---|
          | \`emby_${VERSION}_x86_native.fpk\` | x86_64 |
          | \`emby_${VERSION}_arm_native.fpk\` | ARM64 |

          安装：应用中心 → 手动安装 → 选择对应架构的 \`.fpk\`。

          构建来源见仓库 README；版本号由工作流自动查询上游 stable release 得出。
          EOF
          )" \
            release/*.fpk

          echo "已发布 ${TAG}"
